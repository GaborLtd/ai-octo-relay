display_information:
  name: ai-relay
  description: Single Slack bot for multi-project and multi-agent local CLI control
  background_color: "#1F2937"
features:
  bot_user:
    display_name: ai-relay
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - mpim:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
